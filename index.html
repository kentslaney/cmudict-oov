<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMUDict G2P Transformer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f9f9f9; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .input-group { display: flex; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px 0 0 4px; outline: none; }
        button { padding: 12px 20px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 0 4px 4px 0; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        #status { text-align: center; margin-bottom: 15px; font-style: italic; color: #7f8c8d; }
        .results { margin-top: 20px; }
        .result-item { background: #f1f2f6; padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .phones { font-family: monospace; font-size: 16px; font-weight: bold; color: #2c3e50; }
        .prob { font-size: 14px; color: #e67e22; font-weight: bold; }
    </style>
    <!-- Load ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Phoneme Predictor</h1>
        <div id="status">Loading model and vocabularies...</div>
        <div class="input-group">
            <input type="text" id="wordInput" placeholder="Enter a word (e.g., antigravity)" disabled>
            <button id="predictBtn" disabled>Predict</button>
        </div>
        <div class="results" id="resultsContainer"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
